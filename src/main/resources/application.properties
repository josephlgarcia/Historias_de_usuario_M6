spring.application.name=${APP_NAME}
# Server
server.port=${SERVER_PORT}

# Datasource (the values are loaded from environment variables when present)
# Defaults match the original local PostgreSQL setup
spring.datasource.url=${SPRING_DATABASE}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL}

# Flyway Configuration
spring.flyway.enabled=${FLYWAY_ENABLED}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE}
spring.flyway.locations=${FLYWAY_LOCATIONS}
spring.flyway.schemas=${FLYWAY_SCHEMAS}
spring.flyway.validate-on-migrate=${FLYWAY_VALIDATE_ON_MIGRATE}